services:
  db:
    container_name: postgres
    image: postgres:18.3
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./postgresql/create_table.sql:/docker-entrypoint-initdb.d/todo.sql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: todo
      POSTGRES_USER: todo
